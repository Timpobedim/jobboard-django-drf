[project]
name = "juniorjobs"
version = "1.0.0"
description = "JuniorJobs — API доски вакансий для начинающих разработчиков (Django + DRF)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "django>=5.2",
    "djangorestframework>=3.16",
    "pyjwt>=2.9",
    "django-cors-headers>=4.4",
    "dj-database-url>=2.2",
    "drf-spectacular>=0.28",
    "python-slugify>=8.0",
    "psycopg[binary]>=3.2",
    "gunicorn>=23.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF", "DJ", "PT"]
# RUF001-003: русские строки содержат кириллицу, похожую на латиницу — это нормально.
# RUF012: атрибуты классов DRF (permission_classes и т.п.) — идиоматичный изменяемый дефолт.
ignore = ["RUF001", "RUF002", "RUF003", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107"]
"jobboard/apps/*/serializers.py" = ["N815"]  # camelCase-поля JSON — контракт API

[tool.ruff.lint.isort]
known-first-party = ["jobboard", "tests"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "jobboard.settings"
testpaths = ["tests"]
addopts = """
  --strict-markers
  --tb=short
  --cov=jobboard
  --cov-branch
  --cov-report=term-missing
  --cov-fail-under=95
"""

[tool.coverage.run]
omit = ["*/migrations/*", "jobboard/asgi.py", "jobboard/wsgi.py", "manage.py"]
